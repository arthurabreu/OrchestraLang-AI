[project]
name = "orchestralang"
version = "0.1.0"
description = "OrchestraLang AI — agentes LangChain 1.x com Ollama, OpenRouter free e Grok/xAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0",
  "langchain-ollama>=0.3",
  "langchain-openai>=0.3",
  "python-dotenv>=1.0",
]

[project.scripts]
orchestralang = "orchestralang.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestralang"]
